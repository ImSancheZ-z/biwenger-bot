name: Daily snapshot

on:
  schedule:
    # 07:10 hora de Madrid cae en 05:10 UTC (CEST, verano) o 06:10 UTC (CET,
    # invierno). GitHub Actions no ajusta horario de verano, así que
    # programamos ambas y el primer paso descarta la que no toque.
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que son las 7h en Madrid
        id: check
        run: |
          hour="$(TZ=Europe/Madrid date +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hora actual en Madrid: $hour:xx, no toca ejecutar en este disparo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Descargar snapshot diario
        if: steps.check.outputs.run == 'true'
        run: python scripts/fetch_daily.py

      - name: Commit y push si hay cambios
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biwenger_data.sqlite3
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "chore: snapshot diario $(date -u +%F)"
          git push
